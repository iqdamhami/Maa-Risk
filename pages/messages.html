<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الرسائل | ماء ريسك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="messages">
<div class="app-shell">
  <aside class="sidebar" id="appSidebar">
    <a class="sidebar-brand" href="../index.html">
      <div class="logo-icon">💧</div>
      <div><strong data-i18n="logo">ماء ريسك</strong><small>Climate · Water · Health</small></div>
    </a>
    <nav class="sidebar-nav"><a href="../index.html"><span class="nav-ico">⌂</span><span data-i18n="nav_home">الرئيسية</span></a><a href="data.html" class="" data-requires-auth><span class="nav-ico">▤</span><span data-i18n="nav_data">البيانات</span></a><a href="risk.html" class="" data-requires-auth><span class="nav-ico">◎</span><span data-i18n="nav_risk">المخاطر</span></a><a href="maps.html" class="" data-requires-auth><span class="nav-ico">◈</span><span data-i18n="nav_maps">الخرائط</span></a><a href="solutions.html" class="" data-requires-auth><span class="nav-ico">♮</span><span data-i18n="nav_solutions">الحلول</span></a><a href="costing.html" class="" data-requires-auth><span class="nav-ico">¤</span><span data-i18n="nav_costing">التكاليف</span></a><a href="reports.html" class="" data-requires-auth><span class="nav-ico">▦</span><span data-i18n="nav_reports">التقارير</span></a><a href="messages.html" data-auth="user" style="display:none;"><span class="nav-ico">✉</span><span data-i18n="nav_messages">الرسائل</span></a><a href="admin.html" data-auth="admin" style="display:none;"><span class="nav-ico">⚙</span><span data-i18n="nav_admin">الإدارة</span></a></nav>
    <div class="sidebar-foot">
      <div class="user-chip" data-auth="user" style="display:none;">
        <div class="avatar">U</div>
        <div><div data-auth-name>مستخدم</div><small style="color:var(--text-secondary)">جلسة نشطة</small></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <div class="lang-switcher">
          <button type="button" class="lang-btn active" data-lang="ar">ع</button>
          <button type="button" class="lang-btn" data-lang="en">En</button>
          <button type="button" class="lang-btn" data-lang="fr">Fr</button>
        </div>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Theme">◐</button>
      </div>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="app-main">
    <header class="topbar">
      <div class="topbar-title">
        <h1>صندوق الرسائل</h1>
        <div class="breadcrumbs"><a href="../index.html" data-i18n="logo">ماء ريسك</a> / صندوق الرسائل</div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-outline btn-sm" id="menuToggle">☰</button>
        <a href="login.html" class="btn btn-outline btn-sm" data-auth="guest" data-i18n="nav_login">دخول</a>
        <button type="button" class="btn btn-outline btn-sm" data-auth="user" data-action="logout" style="display:none;" data-i18n="nav_logout">خروج</button>
      </div>
    </header>
    
    <main class="main no-progress">
    <div class="container">
      <div class="page-header">
        <h1>صندوق الرسائل</h1>
        <p>رسائل الإدارة الموجّهة إليك أو للجميع، وإمكانية الرد على الإدارة.</p>
      </div>
      <div class="grid-2">
        <div>
          <h3 style="margin-bottom:12px;">الوارد</h3>
          <div id="user-inbox-list"></div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">مراسلة الإدارة</span></div>
          <form id="user-reply-form">
            <div class="form-group">
              <label for="reply-subject">الموضوع</label>
              <input id="reply-subject" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="reply-body">الرسالة</label>
              <textarea id="reply-body" class="form-control" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">إرسال إلى الإدارة</button>
          </form>
        </div>
      </div>
    </div>
  </main>
  </div>
</div>
<script src="../js/guard.js"></script>
<script src="../js/app.js"></script>
<script src="../js/api.js"></script>
<script src="../js/permissions.js"></script>
<script src="../js/data-store.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>

<script>
(function(){
  var t=document.getElementById('menuToggle');
  var s=document.getElementById('appSidebar');
  var b=document.getElementById('sidebarBackdrop');
  if(t&&s){t.addEventListener('click',function(){s.classList.toggle('open');if(b)b.classList.toggle('show');});}
  if(b&&s){b.addEventListener('click',function(){s.classList.remove('open');b.classList.remove('show');});}
})();
</script>

</body>
</html>
